[workspace]
resolver = "3"
members = [
    "crates/hush_cli",
    "crates/hush_config",
    "crates/hush_core",
    "crates/hush_crypto",
    "crates/hush_envelope",
    "crates/hush_tui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Seyed Ali <seyed.ali.devl@gmail.com>"]
repository = "https://github.com/seyallius/hush"
homepage = "https://github.com/seyallius/hush"
documentation = "https://docs.rs/hush"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.93.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"
